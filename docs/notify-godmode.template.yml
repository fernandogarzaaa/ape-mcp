name: notify-godmode
# TEMPLATE — copy to: genesis, experience-validation-engine, ADAM, skein, EVE---MIRO
# as .github/workflows/notify-godmode.yml, then set REPO_NAME below per repo:
#   genesis | eve | adam | skein | eve-miro
# Requires secret GODMODE_SYNC_TOKEN in the source repo (PAT with contents:write on godmode).
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GODMODE_SYNC_TOKEN }}
          repository: fernandogarzaaa/godmode
          event-type: source-updated
          client-payload: '{"repo": "REPO_NAME", "sha": "${{ github.sha }}"}'
