# GodMode tool/resource/prompt map — every engine reachable, nothing headless
# MCP 2026-07-28: stateless protocol, state in handles. All tools idempotent.

tools:
  - { name: godmode_status, from: [adam(genome/history), genesis(suites), eve(personas)], args: { organism_id: string }, out: { version, genome, engines, mods } }
  - { name: godmode_remember, from: [adam(memory_store)], args: { kind, content, organism_id }, out: { memory_id } }
  - { name: godmode_recall, from: [adam(memory_query)], args: { query, kind, top_k, organism_id }, out: { items: [] } }
  - { name: godmode_validate_experience, from: [eve(session,personas,reporting,panel)], args: { url, persona, goal, seed, cognitive }, out: { task_id, report_uri }, long_running: tasks }
  - { name: godmode_mcp_eval, from: [eve(mcpEval oracles)], args: { target }, out: { schema, conformance, fuzz } }
  - { name: godmode_audit_claim, from: [genesis(audit,evaluate,trust,gate,attest)], args: { spec_or_verifier, suite }, out: { verdict, rates, findings } }
  - { name: godmode_compare, from: [genesis(compare,regression)], args: { run_a, run_b }, out: { delta } }
  - { name: godmode_orchestrate, from: [skein(graph,claim,worktree,verify,supervisor,sync)], args: { op, node, agent_id }, out: { graph, evidence } }
  - { name: godmode_world_simulate, from: [eve-miro(closed_loop,world,ledger)], args: { scenario }, out: { ledger_entry, trust } }
  - { name: godmode_evolve, from: [adam(evolve,propose,accept,reject)+eve(measure)], args: { signals_or_proposal, organism_id }, out: { proposal, fitness }, destructive_confirm: true }
  - { name: godmode_beliefs, from: [adam(beliefs)], args: { statement, organism_id }, out: { beliefs } }
  - { name: godmode_report, from: [eve(reporting), genesis(report-html), miro(ledger)], args: { ref }, out: { html_uri, markdown } }
resources:
  - { uri: genome://current, from: adam-kernel }
  - { uri: memory://{kind}/{id}, from: adam-memory/eventlog }
  - { uri: ledger://genesis, from: genesis-ledger }
  - { uri: audit://adam, from: adam-governance }
  - { uri: graph://skein/current, from: skein-graph }
  - { uri: world://t0, from: eve-miro-world }
  - { uri: report://eve/{id}, from: eve-reporting }
prompts:
  - { name: /godmode, from: adam-skills/godmode + eve-skills, loop: recall-before/verify-while/store-after }
  - { name: /validate-ux, from: eve-skill }
  - { name: /audit-verifier, from: genesis }
trace:
  bus: .godmode/trace.ndjson
  fields: [ts, traceId, tool, argsHash, handles, durationMs, resultSummary, error, modApplied]
  api: [/api/trace?since=, /api/tools, /api/graph, /api/ledger, /api/mods, POST /api/call]
