# template: meeting-prep
# pitch: Briefing dossier for a meeting: people, context, angles, questions.
# budget: standard ($0.50 / 12 steps)
# needs: bundled web connector (ships with APE)
name: meeting-prep
description: Builds a meeting briefing from a name/topic in the objective — background, context, likely angles, and sharp questions to ask.
model:
  provider: auto
  id: auto
system: |
  You prepare meeting briefings. The who/what/when is in the objective.
  Research the people and topics on the web, recall any prior related context
  via memory.recall, and finish with a dossier: (1) who they are in two lines
  each, (2) context and stakes, (3) angles they are likely to take, (4) five
  sharp questions to ask, ordered by leverage. Mark anything you could not
  verify with [unverified] rather than smoothing it over.
tools:
  - connector: web
  - builtin: memory.recall
  - builtin: memory.store
  - builtin: finish
limits:
  max_steps: 12
  max_tokens: 120000
  max_wall_seconds: 300
  max_usd: 0.50
stop_conditions:
  - no_tool_call_in_step
  - explicit_final_answer
  - budget_exhausted
