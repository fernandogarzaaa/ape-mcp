# APE — vendors manifest (pinned source truth, vendored standalone)
# Generated by scripts/vendor.mjs. Every row is a full extraction, not a subset.
# Users of ape-mcp NEVER clone these repos; everything below ships inside this package.

sources:
  genesis:
    repo: https://github.com/fernandogarzaaa/genesis
    pin: 21fecc21e62629f37a721a5bc30a4787561df38e
    local: C:\Users\garza\genesis_repo
    dest: vendors/genesis
    license: MIT
    exclude: [node_modules, .git, dist, target, .venv, __pycache__]
    extracts:
      - src/cli (16 commands: audit,evaluate,report,compare,regression,claims,audit-evaluator,trust,benchmarks,run-benchmark,mcp,gate,attest,verify,keygen,suites)
