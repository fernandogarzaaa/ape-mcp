# First-party Rust TUI binaries: matrix build on tag push (or manual), assets
# attached to the GitHub Release. Postinstall downloads the matching asset;
# the `ape` / `ape-mcp tui` launcher falls back to a one-time cargo build.
# Prebuilts are NEVER committed (see .gitignore) — the release is the source.
name: tui-binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ape-tui-win-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ape-tui-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ape-tui-darwin-arm64
          # Native Intel builder (macos-15-intel, GA until Aug 2027) — no
          # cross-compile from the arm64 runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: ape-tui-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: ape-tui unit tests (each platform builds what it ships)
        run: cargo test --manifest-path tui/Cargo.toml
      - run: cargo build --release --manifest-path tui/Cargo.toml --target ${{ matrix.target }}
      - name: Smoke-test the built binary (non-TTY guard path)
        shell: bash
        run: |
          bin="tui/target/${{ matrix.target }}/release/ape-tui${{ contains(matrix.os, 'windows') && '.exe' || '' }}"
          # Piped stdin is not a TTY: the binary must refuse with exit 2 and
          # the guard message. Anything else (crash, hang, exit 0) fails the
          # job BEFORE the asset uploads, so a dead binary can never ship.
          # NOTE: `set +e` around the run — the expected exit code is 2 and
          # the runner shell has `set -e`, which would kill the step early.
          set +e
          echo | "$bin" > smoke.out 2>&1
          code=$?
          set -e
          cat smoke.out
          test "$code" -eq 2 || { echo "::error::smoke failed: exit $code, want 2"; exit 1; }
          grep -q "run it in a terminal" smoke.out || { echo "::error::smoke failed: guard message missing"; exit 1; }
      - name: Rename binary to platform asset name (so platforms don't collide on download)
        shell: bash
        run: |
          src="tui/target/${{ matrix.target }}/release/ape-tui${{ contains(matrix.os, 'windows') && '.exe' || '' }}"
          cp "$src" "$GITHUB_WORKSPACE/${{ matrix.asset }}"
          ls -la "$GITHUB_WORKSPACE/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  checksums:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-tui
          merge-multiple: true
      - name: Publish SHA256SUMS alongside the binaries
        shell: bash
        run: |
          cd dist-tui
          sha256sum ape-tui-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: dist-tui/SHA256SUMS
  release:
    needs: [build, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialized with adam-binaries' release job (same group name): both
    # workflows append to the SAME tag release (shared repo versioning), and
    # concurrent create-or-update calls can 422-conflict and drop assets.
    # Filenames are disjoint (ape-tui-* vs adam-mcp-*), so ordered appends
    # never overwrite — they just must not run at the same instant.
    concurrency:
      group: release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-tui
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist-tui/*
          # Release candidates stay pre-release; real versions don't.
          prerelease: ${{ contains(github.ref, '-rc.') }}
