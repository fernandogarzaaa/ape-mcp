name: ci
on: [push, pull_request]
jobs:
  godmode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev
      - run: node bin/godmode.js doctor
      - run: node scripts/smoke.mjs
      - run: node --test tests/
