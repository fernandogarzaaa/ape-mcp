# Nightly freepool catalog refresh: query each free-tier provider's own
# /models listing (with repo-secret keys; providers without a secret are
# skipped), merge into catalog/freepool.json, and open/update ONE pull
# request with the diff. Never auto-merges: a human reviews tiers, tool
# support, and limits before anything ships. No third-party catalog service.
#
# Setup (repo Settings):
#   - Secrets (any subset): GROQ_API_KEY, CEREBRAS_API_KEY, GEMINI_API_KEY,
#     MISTRAL_API_KEY, OPENROUTER_API_KEY, NVIDIA_API_KEY,
#     CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, HF_TOKEN, OPENCODE_API_KEY
#   - Actions > General > "Allow GitHub Actions to create and approve pull
#     requests" must be enabled for the PR step.
name: refresh-catalog
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly
  workflow_dispatch: {}
concurrency:
  group: refresh-catalog
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Refresh catalog from provider APIs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        # No npm install needed: the script uses only node built-ins.
        run: node scripts/refresh-catalog.mjs --summary "$RUNNER_TEMP/catalog-summary.md"
      - name: Open or update the refresh PR (no auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/freepool.json; then
            echo "catalog unchanged; nothing to propose"
            exit 0
          fi
          BRANCH="bot/refresh-freepool-catalog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add catalog/freepool.json
          git commit -m "chore(catalog): refresh freepool catalog $(date -u +%F)"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/catalog-summary.md"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "chore(catalog): refresh freepool catalog" \
              --body-file "$RUNNER_TEMP/catalog-summary.md"
          fi
