# Publishes to npm via OIDC trusted publishing (no long-lived NPM_TOKEN).
# Trigger: push a v* tag whose version matches package.json.
# The npm package's Trusted Publisher must name this exact workflow file.
#
# Ordering vs the binary workflows: GitHub Actions has no cross-workflow
# `needs`, so this job CANNOT wait for tui-binaries/adam-binaries. Two
# gates stand in instead, and BOTH must hold before anything publishes:
#  1. The verify-assets step below fails the job unless the tag's release
#     already carries all four ape-tui binaries plus SHA256SUMS (the tag
#     workflows attach them; postinstall downloads them by tag).
#  2. The `npm-publish` environment requires a human reviewer (one-time
#     repo setting, see docs/release.md) who checks the assets by eye.
# Either gate stops a publish that would ship without TUI binaries.
name: publish-npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag version matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag: $TAG / package.json: $PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json version $PKG"; exit 1; }
      - name: Release carries all TUI binaries + SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in ape-tui-win-x64.exe ape-tui-linux-x64 ape-tui-darwin-arm64 ape-tui-darwin-x64 SHA256SUMS; do
            gh release view "${GITHUB_REF_NAME}" --json assets --jq ".assets[].name" | grep -qx "$f" \
              || { echo "::error::release ${GITHUB_REF_NAME} is missing asset: $f (binaries workflow must finish first)"; exit 1; }
          done
          echo "all 5 TUI release files present"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-bom.mjs
      - run: npm publish --provenance --access public
