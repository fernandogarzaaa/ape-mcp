# Publishes to npm via OIDC trusted publishing (no long-lived NPM_TOKEN).
# Trigger: push a v* tag whose version matches package.json.
# The npm package's Trusted Publisher must name this exact workflow file.
name: publish-npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag version matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag: $TAG / package.json: $PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json version $PKG"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-bom.mjs
      - run: npm publish --provenance --access public
