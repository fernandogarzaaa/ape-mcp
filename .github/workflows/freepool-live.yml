name: freepool-live-smoke
on:
  workflow_dispatch:
  push:
    branches: [feat/freepool]
    paths: ['src/agent/freepool/**', 'scripts/freepool-live-smoke.mjs', '.github/workflows/freepool-live.yml']
permissions:
  contents: read
  models: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Raw GitHub Models probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply with exactly: freepool ok"}],"max_tokens":20}' | head -c 1500 || true
      - name: Live smoke (GitHub Models via GITHUB_TOKEN, plus any repo secrets present)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/freepool-live-smoke.mjs
