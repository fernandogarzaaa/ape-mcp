# Live freepool smoke against real free tiers, using whichever pool keys are
# stored as repo secrets. With no pool secret configured the script prints
# "no pool keys configured; skipping" and exits 0, so branch pushes stay green.
# (GitHub Models was retired 2026-07-30; the Actions token adds nothing.)
name: freepool-live-smoke
on:
  workflow_dispatch:
  push:
    branches: [feat/freepool]
    paths: ['src/agent/freepool/**', 'src/agent/providers.js', 'scripts/freepool-live-smoke.mjs', '.github/workflows/freepool-live.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Live smoke (pool keys from repo secrets; skips cleanly if none)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/freepool-live-smoke.mjs
