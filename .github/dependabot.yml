version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Root package only: vendors/ is refreshed by the auto-update workflow.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /tui
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
